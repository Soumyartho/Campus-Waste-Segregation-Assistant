# Ablation: M1 head-only (Phase A only, backbone stays frozen). PLAN.md Section 8.
run_name: mobilenet_v2_headonly
data_config: configs/data.yaml

model:
  name: mobilenet_v2
  pretrained: true
  dropout: 0.3

augment: true

train:
  seed: 42
  batch_size: 32
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  class_weights: true
  amp: true
  early_stopping:
    patience: 4
  phases:
    - name: head
      epochs: 20            # same epoch budget as the fine-tuned run
      lr: 1.0e-3
      trainable: head
      scheduler: cosine

output:
  models_dir: models
  reports_dir: reports
